<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>竣工驗收記錄</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="驗收記錄">
<meta name="theme-color" content="#1d2629">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: full-screen drawing stage, slim top bar, right-hand working panel (bottom sheet on narrow screens) */
:root{
  --board:#1d2629;      /* top bar, drafting-board slate */
  --board-fg:#e8eeec;
  --paper:#e6e9e6;      /* stage behind the drawing */
  --surface:#ffffff;
  --surface-2:#f2f4f2;
  --line:#d3d9d6;
  --fg:#1b2224;
  --muted:#5f6b69;
  --red:#d42a1e;        /* redline markup */
  --red-ink:#ffffff;
  --hl:#f2c230;         /* highlighter */
  --ok:#2f7d4f;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#11171a;--surface:#1b2326;--surface-2:#232d30;--line:#33403f;--fg:#e7eceb;--muted:#9aa7a5;--board:#0c1113;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-text-size-adjust:100%}
#panel,#panel *{touch-action:pan-y}
#bar,#bar *,.float,.float *,#editor button{touch-action:manipulation}
body{font:15px/1.45 var(--sans);background:var(--paper);color:var(--fg);-webkit-user-select:none;user-select:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.vh{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none;z-index:-1}
.btn.g{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
label.btn{display:flex;align-items:center;justify-content:center;cursor:pointer}
.safe{display:flex;flex-direction:column;gap:2px;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.safe b{font-size:15px}.safe span{font-size:12.5px;color:var(--muted)}
.safe.warn{background:color-mix(in srgb,var(--red) 10%,var(--surface));border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.safe.warn b{color:var(--red)}
.safe.ok{background:color-mix(in srgb,var(--ok) 10%,var(--surface))}.safe.ok b{color:var(--ok)}

/* top bar */
#bar{position:fixed;inset:0 0 auto 0;z-index:20;background:var(--board);color:var(--board-fg);
  padding:calc(env(safe-area-inset-top,0px) + 6px) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:8px;min-height:54px}
#bar .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;flex:1 1 auto}
#bar .brand b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .brand span{font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px 12px;color:var(--board-fg);white-space:nowrap;min-height:40px}
.tb:active{background:rgba(255,255,255,.12)}
.tb .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:10px;background:var(--red);color:#fff;font:600 12px/20px var(--mono)}
.seg{display:flex;border:1px solid rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
.seg button{background:transparent;border:0;padding:8px 12px;color:var(--board-fg);min-height:40px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--board-fg);color:var(--board);font-weight:600}

/* stage */
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden;background:var(--paper)}
#board{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#board img{display:block;pointer-events:none;-webkit-user-drag:none;background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.18)}
#hires{position:absolute;left:0;top:0;pointer-events:none}
#ov{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;pointer-events:none}
#empty{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}

/* floating controls on the stage */
.float{position:fixed;z-index:15}
#hint{left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 66px);background:var(--board);color:var(--board-fg);
  padding:7px 14px;border-radius:20px;font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.25);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#maptools{left:max(10px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100vw - 24px)}
#maptools button,#zoombtns button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 13px;min-height:44px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
#maptools button[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
#maptools .go{background:var(--red);color:#fff;border-color:var(--red)}
#zoombtns{right:max(10px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-direction:column;gap:6px}
#zoombtns button{width:46px;padding:0;font-size:20px}
body.pnl #zoombtns{right:412px}
@media (max-width:700px),(orientation:portrait) and (max-width:1100px){
  body.pnl #zoombtns{right:max(10px,env(safe-area-inset-right,0px));bottom:calc(55% + 12px)}
  body.pnl #maptools{bottom:calc(55% + 12px)}}

/* working panel */
#panel{position:fixed;z-index:30;right:0;top:calc(env(safe-area-inset-top,0px) + 54px);bottom:0;width:min(400px,100vw);
  background:var(--surface);border-left:1px solid var(--line);box-shadow:-6px 0 24px rgba(0,0,0,.12);display:flex;flex-direction:column}
@media (max-width:700px),(orientation:portrait) and (max-width:1100px){#panel{top:auto;left:0;width:auto;height:55%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}
  #panel.compact{height:auto;max-height:55%}
  #panel{animation-name:rise}}
@keyframes rise{from{transform:translateY(24px)}}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:17px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph .x{border:0;background:var(--surface-2);border-radius:50%;width:36px;height:36px;font-size:18px;flex:none}
.pb{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.no{font:700 15px/1 var(--mono);background:var(--red);color:#fff;border-radius:6px;padding:6px 8px;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.02em}
label.f input,label.f textarea,label.f select{font:16px/1.4 var(--sans);color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 10px;width:100%}
label.f textarea{resize:vertical;min-height:62px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.idx{font:700 17px/1.35 var(--sans);background:var(--board);color:var(--board-fg);border-radius:10px;padding:10px 12px;word-break:break-word;-webkit-user-select:text;user-select:text}
.f-l{font-size:12px;color:var(--muted);letter-spacing:.02em;margin-bottom:-6px}
.chips.pick .chip{font-size:14px;padding:8px 12px;min-height:38px;background:var(--surface-2);color:var(--fg)}
.chips.pick .chip.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
details summary{font-size:13px;color:var(--muted);cursor:pointer;padding:4px 0}
details[open]{display:flex;flex-direction:column;gap:8px}
#btnFloor b{font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.chip b{font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:11px 14px;min-height:46px;font-weight:500}
.btn.p{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
.btn.dk{background:var(--fg);border-color:var(--fg);color:var(--surface)}
.btn.warn{color:var(--red)}
.btn.armed{background:var(--red);color:#fff;border-color:var(--red)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1 1 0}
.chips.subs{margin-bottom:6px}.chips.pick.subs .chip.on{background:#1f6f9c;border-color:#1f6f9c}
.li em.sub{font-style:normal;font-weight:600;color:#1f6f9c}.li em.sub.none{color:#c46a00}
.grid-note{display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:start}.row.nav>.btn{min-height:40px;padding:8px 6px;font-size:14px}.navpos{margin-top:-4px;font-size:12px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos .ph1{position:relative;aspect-ratio:4/3;border-radius:8px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .del{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;line-height:28px;padding:0}
.photos .ed{position:absolute;left:4px;bottom:4px;font-size:11px;background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:5px}
.sec{font-size:12px;color:var(--muted);text-transform:none;letter-spacing:.04em;margin-top:4px;border-top:1px solid var(--line);padding-top:12px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:64px 1fr;gap:10px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px}
.li .th{width:64px;height:48px;border-radius:6px;background:var(--line) center/cover no-repeat;position:relative}
.li .th .no{position:absolute;left:-4px;top:-4px;font-size:11px;padding:3px 5px}
.li .t{min-width:0}.li .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.cur{outline:2px solid var(--red)}
.note{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:9px;padding:10px 12px;line-height:1.5}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.toggle input{width:22px;height:22px;accent-color:var(--red)}

/* photo markup editor */
#editor{position:fixed;inset:0;z-index:50;background:#0d1112;display:flex;flex-direction:column;color:#eee}
#edtop,#edbot{display:flex;gap:8px;align-items:center;padding:8px max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px));flex-wrap:wrap}
#edtop{padding-top:calc(env(safe-area-inset-top,0px) + 8px);justify-content:space-between}
#edbot{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);justify-content:center}
#edwrap{flex:1;display:grid;place-items:center;overflow:hidden;touch-action:none;min-height:0}
#edCanvas{touch-action:none;display:block;box-shadow:0 0 0 1px #333}
#editor button{background:#253033;border:1px solid #3b4a4d;color:#eee;border-radius:10px;min-height:46px;padding:8px 14px}
#editor button[aria-pressed="true"]{background:#eee;color:#111;border-color:#eee;font-weight:600}
#editor .sw{width:46px;padding:0;position:relative}
#editor .sw i{display:block;width:24px;height:24px;border-radius:50%;margin:auto;border:2px solid #fff}
#editor .ok{background:var(--red);border-color:var(--red);font-weight:600}
.edgrp{display:flex;gap:6px}

#preview{position:fixed;inset:0;z-index:55;background:#3a4244;display:flex;flex-direction:column}
.pvbar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));background:var(--board);color:var(--board-fg);flex-wrap:wrap;touch-action:manipulation}
.pvbar .pvinfo{flex:1;font-size:13px;opacity:.85;min-width:0}
.pvbar button{background:transparent;border:1px solid rgba(255,255,255,.25);color:var(--board-fg);border-radius:9px;padding:8px 14px;min-height:42px}
.pvbar .pvp{background:var(--red);border-color:var(--red);font-weight:600}
.pvbtns{display:flex;gap:8px}
.pvpages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:16px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:14px;touch-action:pan-x pan-y}
.pvpages img{width:100%;max-width:1100px;height:auto;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.35)}
#mFix[aria-pressed="true"]{background:#3fa66a;color:#fff}
#ghost{position:fixed;inset:0;z-index:65;background:#000;touch-action:none}
#ghost video,#ghost img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#ghost img{pointer-events:none}
#ghost .gtop{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;background:linear-gradient(rgba(0,0,0,.6),transparent);font-size:14px}
#ghost .gbot{position:absolute;left:0;right:0;bottom:0;padding:14px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.65))}
#ghost button{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:10px;min-height:44px;padding:8px 14px;touch-action:manipulation}
#ghost .gshut{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25);padding:0}
#ghost .gsl{display:flex;flex-direction:column;font-size:13px;gap:4px;min-width:140px}
#toast{position:fixed;z-index:60;pointer-events:none;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--fg);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90vw}
#busy{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:grid;place-items:center;color:#fff;font-size:16px}
#busy div{background:var(--board);padding:18px 22px;border-radius:12px}
@media (prefers-reduced-motion:no-preference){#panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(20px)}}}
</style>
</head>
<body>
<div id="stage">
  <div id="board"><img id="dwg" alt=""></div>
  <canvas id="hires" hidden></canvas>
  <svg id="ov" xmlns="http://www.w3.org/2000/svg"></svg>
</div>
<div id="empty" hidden><div><p style="font-size:17px;color:var(--fg)">正在載入圖紙…</p><p>如長時間沒有反應，請連網後重新開啟</p></div></div>

<header id="bar">
  <button class="tb" id="btnDrawings" title="圖紙">圖紙</button>
  <div class="brand"><b id="curName">—</b><span id="curSub"></span></div>
  <div class="seg" role="group" aria-label="模式">
    <button id="mInspect" aria-pressed="true">驗收</button>
    <button id="mMap" aria-pressed="false">位置設定</button>
  </div>
  <button class="tb" id="btnRound" title="驗收批次">第1次</button>
  <button class="tb" id="btnFloor" hidden>樓層</button>
  <button class="tb" id="btnItems">記錄<span class="n" id="cnt">0</span></button>
  <button class="tb" id="btnExport">導出</button>
</header>

<div id="hint" class="float"></div>
<div id="maptools" class="float" hidden>
  <button data-tool="select">選取</button>
  <button data-tool="rect">矩形區域</button>
  <button data-tool="poly">多邊形區域</button>
  <button data-tool="gx">縱向軸線 (1,2,3)</button>
  <button data-tool="gy">橫向軸線 (A,B,C)</button>
  <button class="go" id="polyDone" hidden>完成多邊形</button>
  <button id="polyUndo" hidden>退一點</button>
</div>
<div id="zoombtns" class="float">
  <button id="zIn" aria-label="放大">＋</button>
  <button id="zOut" aria-label="縮小">－</button>
  <button id="zFit" aria-label="全圖" style="font-size:13px">全圖</button>
  <button id="zRot" aria-label="旋轉 90°" title="旋轉 90°">⟳</button>
</div>

<aside id="panel" hidden></aside>

<div id="editor" hidden>
  <div id="edtop">
    <button data-ed="cancel">取消</button>
    <div class="edgrp">
      <button data-ed="tool" data-v="arrow" aria-pressed="true">箭頭</button>
      <button data-ed="tool" data-v="ellipse">圈選</button>
      <button data-ed="tool" data-v="rect">方框</button>
      <button data-ed="tool" data-v="pen">手繪</button>
    </div>
    <button data-ed="done" class="ok">完成</button>
  </div>
  <div id="edwrap"><canvas id="edCanvas"></canvas></div>
  <div id="edbot">
    <div class="edgrp">
      <button class="sw" data-ed="color" data-v="#e5251a" aria-pressed="true" aria-label="紅"><i style="background:#e5251a"></i></button>
      <button class="sw" data-ed="color" data-v="#ffd21f" aria-label="黃"><i style="background:#ffd21f"></i></button>
      <button class="sw" data-ed="color" data-v="#22a6f2" aria-label="藍"><i style="background:#22a6f2"></i></button>
      <button class="sw" data-ed="color" data-v="#ffffff" aria-label="白"><i style="background:#fff"></i></button>
    </div>
    <button data-ed="undo">撤銷</button>
    <button data-ed="clear">清除標記</button>
  </div>
</div>

<input type="file" id="camInput" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input type="file" id="fixCam" class="vh" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input type="file" id="fixLib" class="vh" accept="image/*" tabindex="-1" aria-hidden="true">
<input type="file" id="photoRestore" class="vh" accept="image/*" multiple tabindex="-1" aria-hidden="true">
<input type="file" id="libInput" class="vh" accept="image/*" tabindex="-1" aria-hidden="true">
<input type="file" id="dwgInput" class="vh" accept="application/pdf,image/*" tabindex="-1" aria-hidden="true">
<input type="file" id="jsonInput" class="vh" accept=".zip,application/zip,application/json,.json" tabindex="-1" aria-hidden="true">
<div id="preview" hidden>
  <div class="pvbar"><button data-pv="close">關閉</button><span class="pvinfo"></span><span class="pvbtns"><button data-pv="pdf" class="pvp">導出 PDF</button><button data-pv="docx">導出 Word</button></span></div>
  <div class="pvpages"></div>
</div>
<div id="toast" hidden></div>
<div id="busy" hidden><div id="busyMsg">處理中…</div></div>

<script src="lib/pdf.min.js"></script>
<script src="lib/docx.umd.js"></script>
<script src="lib/jszip.min.js"></script>
<script src="lib/qrcode.js"></script>
<script src="lib/jsQR.js"></script>
<script src="lib/jspdf.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
