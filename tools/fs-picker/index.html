<style>
/* layout: a drawing register — one row per sheet, grouped by folder, keep/drop tick on the right */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171c; --panel: #182129; --ink: #e5ebf0; --muted: #98a6b3; --line: #2c3843;

:root[data-theme="dark"] {
  --bg: #11171c; --panel: #182129; --ink: #e5ebf0; --muted: #98a6b3; --line: #2c3843;
  --accent: #ef6b61; --keep: #5cc596; --keep-bg: #183429; --drop-bg: #3a1f1d; --chip: #222d36; color-scheme: dark }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
header .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 12px; }
h1 { font-size: 19px; margin: 0; font-weight: 700; text-wrap: balance; }
.sum { display: flex; gap: 14px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; flex-wrap: wrap; }
.sum b { color: var(--ink); }
.sum .k b { color: var(--keep); } .sum .d b { color: var(--accent); }
.status { font-size: 13px; color: var(--muted); margin-left: auto; }
.status.err { color: var(--accent); }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 7px 12px; min-height: 36px; }

button.primary { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.intro { color: var(--muted); font-size: 14px; max-width: 65ch; margin: 16px 0 8px; }
.note-box { background: var(--drop-bg); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin: 8px 0; }
.me { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; margin: 8px 0; }
.me input { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); width: 12em; max-width: 100%; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 4px; }
.tools input[type=search] { flex: 1 1 220px; min-width: 0; font: inherit; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.chip { background: var(--chip); border-color: transparent; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); }
section { margin-top: 22px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; padding-bottom: 6px; border-bottom: 2px solid var(--ink); }
.sec-h h2 { font-size: 16px; margin: 0; }
.sec-h .cnt { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.sec-h .bulk { margin-left: auto; display: flex; gap: 6px; }
.sec-h .bulk button { font-size: 13px; min-height: 30px; padding: 4px 10px; }
.row { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row.off .t, .row.off .th { opacity: .55; }
.row.off .name { text-decoration: line-through; text-decoration-color: var(--accent); }
.th { width: 112px; aspect-ratio: 1.414; max-width: 100%; border: 1px solid var(--line); border-radius: 4px; cursor: zoom-in; padding: 0; background-color: #fff; background-position: left top; background-size: cover; }
.t { min-width: 0; }
.name { font-weight: 500; overflow-wrap: anywhere; }
.meta { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 12px; }
.meta .no { font-family: var(--mono); color: var(--ink); }
.tag { font-size: 12px; border-radius: 999px; padding: 0 8px; background: var(--chip); color: var(--muted); }
.tag.plan { background: var(--keep-bg); color: var(--keep); }
.who { font-size: 12px; color: var(--muted); }
.memo { font: 13px var(--sans); width: 100%; max-width: 420px; margin-top: 4px; padding: 4px 8px; border: 1px dashed var(--line); border-radius: 6px; background: transparent; color: var(--ink); box-sizing: border-box; }
.pick { display: flex; flex-direction: column; align-items: center; gap: 2px; }

.row.off .pick label { background: var(--drop-bg); color: var(--accent); }
.pick input { width: 20px; height: 20px; accent-color: var(--keep); }
.empty { color: var(--muted); padding: 24px 0; }
dialog { border: none; border-radius: 10px; padding: 12px; max-width: 96vw; background: var(--panel); color: var(--ink); }
#copyDlg { max-width: min(92vw, 760px); }
#big { width: 96vw; height: 92vh; box-sizing: border-box; flex-direction: column; gap: 8px; }
#big[open] { display: flex; }
dialog::backdrop { background: rgb(0 0 0 / .55); }
.vbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vbar p { margin: 0; flex: 1 1 260px; min-width: 0; font-size: 14px; }
.view { flex: 1; min-height: 0; display: flex; gap: 10px; }
.pane { flex: 1; min-width: 0; overflow: auto; background: #fff; border-radius: 6px; cursor: zoom-in; }
.pane.z { cursor: zoom-out; }
.pane img { display: block; width: 100%; height: auto; max-width: none; }
.pane.z img { width: 300%; }
.tbp { flex: 0 0 auto; width: min(28%, 340px); overflow: auto; background: #fff; border-radius: 6px; }
.tbp img { display: block; width: 100%; max-width: none; }

  .th { width: 80px; }

  .status { margin-left: 0; width: 100%; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

<header><div class="wrap">
  <h1>消防圖紙去留</h1>
  <div class="sum"><span class="k">保留 <b id="nKeep">149</b></span><span class="d">刪除 <b id="nDrop">0</b></span><span>共 <b id="nAll">149</b> 張</span></div>

</div></header>

<main class="wrap">
  <p class="intro">FS501 驗收程式「消防」圖紙清單。不需要的圖紙取消「保留」，每次勾選即時儲存，所有打開這一頁的人看到同一份。按縮圖看大圖：再按一下放大，右邊是標題欄，可用「上一張／下一張」逐張看。沒有平面範圍的圖（附註、表、系統圖、控制屏）標示「無平面」。</p>
  <div class="me" id="meBox" hidden><label for="meName">你的名字（記錄誰改過）</label><input id="meName" placeholder="例如 陳大文" maxlength="40"></div>
  <div class="note-box" id="offline" hidden></div>
  <div class="tools">
    <input type="search" id="q" placeholder="搜尋圖名、圖號或檔名" aria-label="搜尋">
    <button class="chip" data-f="all" aria-pressed="true">全部</button>
    <button class="chip" data-f="noplan" aria-pressed="false">只看無平面</button>
    <button class="chip" data-f="drop" aria-pressed="false">只看刪除</button>
  </div>
  <div id="list"></div>
</main>

<dialog id="big"><div class="vbar"><p id="bigCap"></p><button id="bigPrev">上一張</button><button id="bigNext">下一張</button><button id="bigZoom">放大</button><button id="bigClose">關閉</button></div>

          ${who ? `<div class="who">${who}</div>` : ''}
          <input class="memo" id="memo-${r.id}" data-memo="${r.id}" placeholder="備註（可留空）" value="${esc(p.note || '')}"></div>
        <div class="pick"><label><input type="checkbox" data-pick="${r.id}" ${k ? 'checked' : ''}>保留</label></div></div>`; }).join('')}</section>`;
  }).join('') : '<p class="empty">沒有符合的圖紙。</p>';
  const nk = ROWS.filter(r => keepOf(r.id)).length;
  $('#nKeep').textContent = nk; $('#nDrop').textContent = ROWS.length - nk; $('#nAll').textContent = ROWS.length;
}
// a remote update re-renders the list: keep the cursor where someone is typing a memo
function rerender() {
  const a = document.activeElement, f = a && a.id, pos = a && a.selectionStart;
  render();
  if (f) { const el = document.getElementById(f); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) { } } }
}

async function setKeep(ids, keep) {
  let n = 0, todo = ids.filter(id => keepOf(id) !== keep);
  for (const id of todo) {
    const old = picks[id] || {}, body = { keep, note: old.note || '', by: myName(), at: Date.now() };
    picks[id] = body; render();
    try { await store.write(id, body); n++; if (todo.length > 1) status(`儲存中 ${n}／${todo.length}`); }
    catch (e) { picks[id] = old; render(); status('未能儲存，請稍後再試（' + (e.code || e.message) + '）', true); return; }
  }
  render(); status(store.label);
}

document.addEventListener('change', e => { const c = e.target.closest('[data-pick]'); if (c) setKeep([c.dataset.pick], c.checked); });
const memoT = {};
document.addEventListener('input', e => {
  const m = e.target.closest('[data-memo]'); if (!m) return; const id = m.dataset.memo;
  clearTimeout(memoT[id]); memoT[id] = setTimeout(async () => {
    const old = picks[id] || {}; if ((old.note || '') === m.value) return;
    const body = { keep: keepOf(id), note: m.value.slice(0, 500), by: myName(), at: Date.now() };
    picks[id] = body;
    try { await store.write(id, body); status('已儲存備註'); } catch (err) { picks[id] = old; status('未能儲存備註（' + (err.code || err.message) + '）', true); }
  }, 900);
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-bulk]');
  if (b) { setKeep(ROWS.filter(r => grpOf(r) === b.dataset.g).map(r => r.id), b.dataset.bulk === '1'); return; }
  const f = e.target.closest('[data-f]');
  if (f) { filter = f.dataset.f; document.querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', x === f)); render(); return; }
  const big = e.target.closest('[data-big]'); if (big) openBig(big.dataset.big);
});

function openBig(id) {
  const r = ROWS.find(x => x.id === id); bigId = id;
  $('#bigImg').src = r.pv || r.th; $('#pane').classList.remove('z'); $('#bigZoom').textContent = '放大';
  $('#tbp').hidden = !r.tb; if (r.tb) $('#tbImg').src = r.tb;
  $('#bigCap').textContent = `${r.name}　${r.no}　${r.src} 第 ${r.page} 頁　（${keepOf(id) ? '保留' : '刪除'}）`;
  if (!$('#big').open) $('#big').showModal();
}
function step(n) { const L = [...document.querySelectorAll('.row')].map(x => x.dataset.id), i = L.indexOf(bigId); if (i >= 0 && L[i + n]) openBig(L[i + n]); }
function zoomAt(ev) {
  const P = $('#pane'), on = !P.classList.contains('z'), R = P.getBoundingClientRect();
  const rx = ev ? (ev.clientX - R.left + P.scrollLeft) / P.scrollWidth : 0.5, ry = ev ? (ev.clientY - R.top + P.scrollTop) / P.scrollHeight : 0.5;
  P.classList.toggle('z', on); $('#bigZoom').textContent = on ? '整張' : '放大';
  if (on) { P.scrollLeft = rx * P.scrollWidth - P.clientWidth / 2; P.scrollTop = ry * P.scrollHeight - P.clientHeight / 2; }
}
$('#pane').onclick = ev => zoomAt(ev);
$('#bigZoom').onclick = () => zoomAt(null);
$('#bigPrev').onclick = () => step(-1); $('#bigNext').onclick = () => step(1);
$('#bigClose').onclick = () => $('#big').close();
$('#copyClose').onclick = () => $('#copyDlg').close();
document.addEventListener('keydown', e => { if (!$('#big').open) return; if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); });
$('#q').addEventListener('input', render);
$('#meName').addEventListener('input', e => { try { localStorage.setItem('fsPickName', e.target.value.trim()); } catch (err) { } });

function listText() {
  const drop = ROWS.filter(r => !keepOf(r.id)), noted = ROWS.filter(r => keepOf(r.id) && picks[r.id] && picks[r.id].note);
  const line = r => `- ${r.id}　${r.name}${r.no ? '　' + r.no : ''}　(${r.src} p.${r.page})${picks[r.id] && picks[r.id].note ? '　備註：' + picks[r.id].note : ''}`;
  return `消防圖紙去留：保留 ${ROWS.length - drop.length}，刪除 ${drop.length}，共 ${ROWS.length}\n\n刪除：\n${drop.map(line).join('\n') || '（沒有）'}\n` +
    (noted.length ? `\n保留但有備註：\n${noted.map(line).join('\n')}\n` : '');
}
$('#copyBtn').onclick = () => {
  const txt = listText(); $('#copyOut').value = txt;
  const done = () => { $('#copyDlg').showModal(); $('#copyOut').select(); };
  try { navigator.clipboard.writeText(txt).then(done, done); } catch (e) { done(); }
};
$('#saveBtn').onclick = () => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + listText()], { type: 'text/plain;charset=utf-8' }));
  a.download = '消防圖紙去留結果_' + new Date().toISOString().slice(0, 10) + '.txt'; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
};

// ---- where ticks are kept ----
function localStore(msg) {
  try { Object.assign(picks, JSON.parse(localStorage.getItem('fsPicks') || '{}')); } catch (e) { }
  $('#offline').hidden = false; $('#offline').textContent = msg; $('#saveBtn').hidden = !!window.claude;
  return { label: '已記在這個瀏覽器', write: async (id, body) => { picks[id] = body; try { localStorage.setItem('fsPicks', JSON.stringify(picks)); } catch (e) { } } };
}
async function fireStore() {
  const u = m => `https://www.gstatic.com/firebasejs/10.14.1/firebase-${m}.js`;
  const [app, auth, fs] = await Promise.all([import(u('app')), import(u('auth')), import(u('firestore'))]);
  const a = app.initializeApp(FIRE, 'fsPicker'), au = auth.getAuth(a);
  await au.authStateReady(); if (!au.currentUser) await auth.signInAnonymously(au);
  const db = fs.getFirestore(a), uid = au.currentUser.uid;
  const t = setTimeout(() => status('暫時連不上，勾選會在連線後送出', true), 10000);
  fs.onSnapshot(fs.collection(db, 'fsPicks'), snap => {
    clearTimeout(t);
    snap.docChanges().forEach(ch => { if (ch.type === 'removed') delete picks[ch.doc.id]; else { const d = ch.doc.data(); picks[ch.doc.id] = { keep: d.keep, note: d.note || '', by: d.by || '', at: d.at && d.at.toMillis ? d.at.toMillis() : Date.now() }; } });
    if (!snap.metadata.fromCache && /連線中|連不上/.test($('#status').textContent)) status('已連線，勾選即時儲存');
    rerender();
  }, err => { clearTimeout(t); status(err.code === 'permission-denied' ? '雲端未開放：Firestore 規則還未更新，勾選不會儲存' : '雲端讀取失敗（' + err.code + '）', true); });
  $('#meBox').hidden = false; $('#meName').value = myName();
  return { label: '已儲存', write: (id, body) => fs.setDoc(fs.doc(db, 'fsPicks', id), { keep: body.keep, note: body.note, by: body.by.slice(0, 40), uid, at: fs.serverTimestamp() }) };
}
async function claudeStore(db, user) {
  const names = {};
  db.collection('picks').onSnapshot(async snap => {
    for (const d of snap.docs) picks[d.id] = d.data();
    snap.docChanges().forEach(ch => { if (ch.type === 'removed') delete picks[ch.doc.id]; });
    if (!snap.metadata.fromCache) status('已連線，勾選即時儲存');
    const ids = [...new Set(Object.values(picks).map(p => p.uid).filter(Boolean))].filter(i => !(i in names));
    if (user && ids.length) { try { const ps = await user.profiles(ids); for (const i of ids) names[i] = (ps[i] && ps[i].name) || ''; } catch (e) { } }
    rerender();
  }, err => status('共享儲存出錯（' + err.code + '），請重新整理頁面', true));
  const me = user ? await user.id() : '';
  return { label: '已儲存', nameOf: p => names[p.uid] || p.by || '有人', write: (id, body) => db.collection('picks').doc(id).set({ ...body, uid: me || '' }) };
}
async function boot() {
  render();
  try {
    if (FIRE) store = await fireStore();
    else if (window.claude && window.claude.use) {
      const db = await claude.use('db'), user = await claude.use('user');
      store = db ? await claudeStore(db, user) : localStore('未能連上共享儲存（可能未登入或沒有編輯權限）。勾選只記在這個瀏覽器；完成後按「複製清單」，把文字發回。');
    } else store = localStore('這是離線檔：勾選記在這部電腦的瀏覽器。完成後按「下載結果檔」或「複製清單」，把結果發回。');
  } catch (e) {
    store = localStore('未能連上雲端（' + (e.code || e.message) + '）。勾選暫時只記在這個瀏覽器；完成後按「複製清單」，把文字發回。');
  }
  if (store.label === '已記在這個瀏覽器') status('勾選記在這個瀏覽器');
  render();
}
boot();
</script>
</body></html>
